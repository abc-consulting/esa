<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="esa-image-relay-base-url" content="http://localhost:5510" />
  <title>WG Search</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="topbar">
    <span class="app-name">WG Search</span>
    <button id="profiles-fab" style="display:none">
      <span id="profiles-fab-icon"> 👥 </span>
      <span id="profiles-fab-count"></span>
    </button>
    <select id="siteSelect">
      <option value="esa">ESA</option>
      <option value="redvelvet">RedVelvet</option>
    </select>
    <button id="adminBtn" class="scrape-mode-btn" title="Admin">Admin</button>
  </nav>

  <!-- Admin modal -->
  <div id="admin-modal" class="admin-modal" style="display:none">
    <div class="admin-modal-box">
      <div class="admin-modal-header">
        <span class="admin-modal-title">Admin</span>
        <button id="adminCloseBtn" class="admin-modal-close" aria-label="Close">&#10005;</button>
      </div>
      <div class="admin-modal-section">
        <div class="admin-modal-row">
          <span class="admin-modal-label">Scrape mode</span>
          <button id="scrapeModeBtn" class="scrape-mode-btn scrape-mode-toggle">OFF</button>
        </div>
        <p class="admin-modal-hint">When ON, all searches and profile loads force a live scrape and upsert results into the database.</p>
      </div>
      <div class="admin-modal-section">
        <div class="admin-modal-row">
          <span class="admin-modal-label">Failed images</span>
          <span id="adminFailedCount" class="admin-failed-count">–</span>
        </div>
        <button id="adminRetryBtn" class="admin-retry-btn" disabled>Re-fetch failed images</button>
        <div id="adminRetryStatus" class="admin-retry-status"></div>
      </div>
    </div>
  </div>

  <div class="search-bar">
    <input
      type="text"
      id="searchInput"
      placeholder="Nickname or UID…"
      autocomplete="off"
    />
    <button id="searchBtn">Search</button>
    <input
      type="text"
      id="areaInput"
      placeholder="Area (e.g. Sea Point)…"
      autocomplete="off"
    />
    <button id="areaBtn">Search Area</button>
    <div id="area-dropdown-wrap" class="multi-select-wrap" style="display:none">
      <button id="areaDropdownBtn" class="multi-select-btn" type="button">Areas ▾</button>
      <div id="areaDropdownPanel" class="multi-select-panel" style="display:none"></div>
    </div>
    <div id="tag-dropdown-wrap" class="multi-select-wrap" style="display:none">
      <button id="tagDropdownBtn" class="multi-select-btn" type="button">Tags ▾</button>
      <div id="tagDropdownPanel" class="multi-select-panel" style="display:none"></div>
    </div>
  </div>

  <div id="filter-bar" class="filter" style="display:none">
    <input
      type="text"
      id="filterInput"
      placeholder="Filter"
      autocomplete="off"
    />
    <div id="redvelvet-detail-filters" style="display:none">
      <span class="filter-by-label">Filter by</span>
      <button id="ageFilterBtn" class="filter-by-btn" type="button">Age</button>
      <button id="bustFilterBtn" class="filter-by-btn" type="button">Bust size</button>
    </div>
  </div>
  <div id="filter-chips-bar" style="display:none">
    <div id="filter-chips"></div>
  </div>

  <div id="status"></div>
  <details id="favorites-details">
    <summary>Favorites</summary>
    <div id="favorites-container"></div>
  </details>
  <div id="content-layout">
    <div id="profiles-sidebar-sticky">
      <div id="profiles-container"></div>
    </div>
    <div id="main-area">
      <div id="profile-details-container"></div>
      <div id="images-container"></div>
      <div id="selected-output"></div>
    </div>
  </div>

  <!-- Age filter modal -->
  <div id="age-modal" class="filter-modal" style="display:none">
    <div class="filter-modal-box">
      <h3 class="filter-modal-title">Filter by Age</h3>
      <div class="filter-modal-row">
        <input type="number" id="ageMinInput" placeholder="Min age" min="18" max="99" />
        <span class="filter-modal-sep">–</span>
        <input type="number" id="ageMaxInput" placeholder="Max age" min="18" max="99" />
      </div>
      <div class="filter-modal-actions">
        <button id="ageClearBtn" class="filter-modal-clear" type="button">Clear</button>
        <button id="ageApplyBtn" class="filter-modal-apply" type="button">Apply</button>
      </div>
    </div>
  </div>

  <!-- Bust filter modal -->
  <div id="bust-modal" class="filter-modal" style="display:none">
    <div class="filter-modal-box">
      <h3 class="filter-modal-title">Filter by Bust Size</h3>
      <div class="filter-modal-row">
        <select id="bandSelect">
          <option value="">Band</option>
          <option value="28">28</option>
          <option value="30">30</option>
          <option value="32">32</option>
          <option value="34">34</option>
          <option value="36">36</option>
          <option value="38">38</option>
          <option value="40">40</option>
          <option value="42">42</option>
          <option value="44">44</option>
        </select>
        <select id="cupSelect">
          <option value="">Cup</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
          <option value="DD">DD</option>
          <option value="E">E</option>
          <option value="F">F</option>
          <option value="G">G</option>
          <option value="H">H</option>
        </select>
      </div>
      <div class="filter-modal-row">
        <div id="sizeMinWrap" class="size-dropdown-wrap">
          <button id="sizeMinBtn" class="multi-select-btn" type="button">Min size ▾</button>
          <div id="sizeMinPanel" class="multi-select-panel size-panel" style="display:none"></div>
        </div>
        <div id="sizeMaxWrap" class="size-dropdown-wrap">
          <button id="sizeMaxBtn" class="multi-select-btn" type="button">Max size ▾</button>
          <div id="sizeMaxPanel" class="multi-select-panel size-panel" style="display:none"></div>
        </div>
      </div>
      <div class="filter-modal-actions">
        <button id="bustClearBtn" class="filter-modal-clear" type="button">Clear</button>
        <button id="bustApplyBtn" class="filter-modal-apply" type="button">Apply</button>
      </div>
    </div>
  </div>

  <!-- Mobile profiles drawer -->
  <div id="profiles-drawer" style="display:none">
    <div id="profiles-drawer-box">
      <div id="profiles-drawer-header">
        <input type="text" id="drawerFilterInput" placeholder="Filter…" autocomplete="off" />
        <button id="profiles-drawer-close" aria-label="Close">&#10005;</button>
      </div>
      <div id="profiles-drawer-list"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="src/client/app.js"></script>
</body>
</html>
