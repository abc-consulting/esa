<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="esa-image-relay-base-url" content="http://localhost:5510" />
  <title>WG Search</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="topbar">
    <span class="app-name">WG Search</span>
    <select id="siteSelect">
      <option value="esa">ESA</option>
      <option value="redvelvet">RedVelvet</option>
    </select>
  </nav>

  <div class="search-bar">
    <input
      type="text"
      id="searchInput"
      placeholder="Nickname or UID…"
      autocomplete="off"
    />
    <button id="searchBtn">Search</button>
    <input
      type="text"
      id="areaInput"
      placeholder="Area (e.g. Sea Point)…"
      autocomplete="off"
    />
    <button id="areaBtn">Search Area</button>
    <div id="area-dropdown-wrap" class="multi-select-wrap" style="display:none">
      <button id="areaDropdownBtn" class="multi-select-btn" type="button">Areas ▾</button>
      <div id="areaDropdownPanel" class="multi-select-panel" style="display:none"></div>
    </div>
    <div id="tag-dropdown-wrap" class="multi-select-wrap" style="display:none">
      <button id="tagDropdownBtn" class="multi-select-btn" type="button">Tags ▾</button>
      <div id="tagDropdownPanel" class="multi-select-panel" style="display:none"></div>
    </div>
  </div>

  <div id="filter-bar" class="filter" style="display:none">
    <input
      type="text"
      id="filterInput"
      placeholder="Filter"
      autocomplete="off"
    />
    <div id="redvelvet-detail-filters" style="display:none">
      <input type="number" id="ageMinInput" placeholder="Age min" min="18" max="99" />
      <input type="number" id="ageMaxInput" placeholder="Age max" min="18" max="99" />
      <select id="bandSelect">
        <option value="">Band</option>
        <option value="28">28</option>
        <option value="30">30</option>
        <option value="32">32</option>
        <option value="34">34</option>
        <option value="36">36</option>
        <option value="38">38</option>
        <option value="40">40</option>
        <option value="42">42</option>
        <option value="44">44</option>
      </select>
      <select id="cupSelect">
        <option value="">Cup</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="DD">DD</option>
        <option value="E">E</option>
        <option value="F">F</option>
        <option value="G">G</option>
        <option value="H">H</option>
      </select>
      <div id="sizeMinWrap" class="size-dropdown-wrap">
        <button id="sizeMinBtn" class="multi-select-btn" type="button">Min size ▾</button>
        <div id="sizeMinPanel" class="multi-select-panel size-panel" style="display:none"></div>
      </div>
      <div id="sizeMaxWrap" class="size-dropdown-wrap">
        <button id="sizeMaxBtn" class="multi-select-btn" type="button">Max size ▾</button>
        <div id="sizeMaxPanel" class="multi-select-panel size-panel" style="display:none"></div>
      </div>
      <button id="filterBtn">Filter</button>
    </div>
  </div>
  <div id="filter-chips-bar" style="display:none">
    <div id="filter-chips"></div>
  </div>

  <div id="status"></div>
  <details id="favorites-details">
    <summary>Favorites</summary>
    <div id="favorites-container"></div>
  </details>
  <div id="content-layout">
    <div id="profiles-container"></div>
    <div id="main-area">
      <div id="profile-details-container"></div>
      <div id="images-container"></div>
      <div id="selected-output"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script type="module" src="src/client/app.js"></script>
</body>
</html>
